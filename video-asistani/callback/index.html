<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Giriş tamam</title><style>body{margin:0;background:#06100C;color:#F4F7F5;font:16px/1.6 system-ui,Segoe UI,sans-serif}main{max-width:760px;margin:0 auto;padding:32px 16px}h1{color:#2BE39B;margin:0 0 8px}h2{margin-top:28px}a{color:#2BE39B}code,.box{background:#0d1a14;border:1px solid #1d3328;border-radius:10px}.box{padding:14px;word-break:break-all;font-family:Consolas,monospace}button{background:#2BE39B;color:#06100C;border:0;border-radius:10px;padding:10px 18px;font-weight:800;cursor:pointer;margin-top:10px}small{color:#8FA39A}</style></head><body><main><h1>Giriş tamamlandı</h1>
<p>Aşağıdaki kodu kopyalayıp yükleme aracına yapıştır. Kod birkaç dakika geçerlidir.</p>
<div class="box" id="code">—</div><button id="b">Kodu kopyala</button>
<p id="err" style="color:#FF5A5F"></p>
<script>
const q=new URLSearchParams(location.search);
document.getElementById("code").textContent=q.get("code")||"(kod yok)";
if(q.get("error")) document.getElementById("err").textContent="Hata: "+q.get("error")+" "+(q.get("error_description")||"");
document.getElementById("b").onclick=async()=>{const t=q.get("code")||"";try{await navigator.clipboard.writeText(t)}catch(e){}document.getElementById("b").textContent="Kopyalandı ✓"};
</script><p><small>Nova Dijital · İletişim: <a href="mailto:novadijital65@gmail.com">novadijital65@gmail.com</a> · Son güncelleme: 11 Ekim 2026</small></p></main></body></html>
